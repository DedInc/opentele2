[package]
name = "opentele2-core"
description = "Pure Rust core of opentele2: Telegram Desktop tdata formats and crypto, with no async, network, or FFI"
keywords = ["telegram", "tdata", "tdesktop", "opentele"]
categories = ["parser-implementations", "cryptography"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# The golden vectors, their generator and the test fixtures stay in the
# repository; tests read them through CARGO_MANIFEST_DIR.
exclude = ["tests/vectors", "tests/fixtures"]

[dependencies]
thiserror.workspace = true
md-5 = "0.11.0"
grammers-crypto = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
pbkdf2 = "0.13.0"
hmac = "0.13.0"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
scrypt = { version = "0.12.0", default-features = false }
getrandom = "0.4.3"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
# `preserve_order` keeps object keys in insertion order, which the session
# JSON of `api::ApiProfile::to_session_json` needs to match 1.5.0 byte for byte.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
rayon = { version = "1.12.0", optional = true }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"], optional = true }

[features]
default = ["parallel"]
# Runs the `batch` entry points on a dedicated rayon pool; without it they
# run sequentially with identical results.
parallel = ["dep:rayon"]
# Writes and reads Telethon `.session` files (`session::telethon_file`) with
# a bundled SQLite. Off by default so the default core links no C code.
telethon-sqlite = ["dep:rusqlite"]

[dev-dependencies]
hex = "0.4.3"

[lints]
workspace = true

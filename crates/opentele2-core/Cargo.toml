[package]
name = "opentele2-core"
description = "Pure Rust core of opentele2: Telegram Desktop tdata formats and crypto, with no async, network, or FFI"
keywords = ["telegram", "tdata", "tdesktop", "opentele"]
categories = ["parser-implementations", "cryptography"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
md-5 = "0.11.0"
grammers-crypto = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
pbkdf2 = "0.13.0"
hmac = "0.13.0"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
scrypt = { version = "0.12.0", default-features = false }
getrandom = "0.4.3"

[dev-dependencies]
serde_json = "1.0.154"
hex = "0.4.3"

[lints]
workspace = true

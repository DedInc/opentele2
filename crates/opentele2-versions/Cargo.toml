[package]
name = "opentele2-versions"
description = "Current official Telegram client versions and stable Chrome/Firefox versions, as a patch onto opentele2-core Versions"
keywords = ["telegram", "versions", "tdesktop", "chrome", "firefox"]
categories = ["api-bindings", "parser-implementations"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
opentele2-core = { version = "2.0.0", path = "../opentele2-core", default-features = false }
# Blocking HTTP with its default rustls TLS (and gzip); no async runtime.
ureq = "3.4.2"
regex = "1.13.1"
serde_json = "1.0.154"

[lints]
workspace = true

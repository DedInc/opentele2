[workspace]
resolver = "3"
members = ["crates/opentele2-core"]

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/DedInc/opentele2"

[workspace.dependencies]
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

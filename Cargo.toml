[workspace]
resolver = "3"
members = ["crates/*", "bindings/python", "bindings/node"]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/DedInc/opentele2"

[workspace.dependencies]
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# PBKDF2 100000 rounds and Argon2id 64 MiB take seconds unoptimised; optimise
# only the hashing crates so debug test runs stay fast and debuggable.
[profile.dev.package]
argon2 = { opt-level = 3 }
blake2 = { opt-level = 3 }
pbkdf2 = { opt-level = 3 }
sha1 = { opt-level = 3 }
sha2 = { opt-level = 3 }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

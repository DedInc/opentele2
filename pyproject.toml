[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opentele2"
version = "2.0.0a1"
description = "A Python Telegram API Library for converting between tdata and telethon sessions, with built-in official Telegram APIs."
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [
    { name = "DedInc.", email = "visitanimation@gmail.com" },
]
keywords = ["tdata", "tdesktop", "telegram", "telethon", "opentele", "opentele2"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 5 - Production/Stable",
]
dependencies = [
    "telethon>=1.45.0",
    "opentele2-core==2.0.0a1",
    'typing_extensions>=4.7; python_version < "3.10"',
]

[project.optional-dependencies]
web = [
    "browserforge",
]
[project.urls]
Homepage = "https://github.com/DedInc/opentele2"
"Bug Tracker" = "https://github.com/DedInc/opentele2/issues"

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/src",
]
exclude = [
    "**/__pycache__",
    "/.ruff_cache",
    "/.pytest_cache",
    "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = "opentele2"
[package]
name = "opentele2-node"
description = "Node.js bindings of opentele2-core: Telegram Desktop tdata formats and crypto through Node-API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
# The addon only loads inside Node; its behaviour is tested by
# bindings/node/__test__ through node:test.
test = false
doctest = false

[dependencies]
# `telethon-sqlite`: the Telethon `.session` file over a bundled SQLite, so
# `opentele2/telethon` works on every supported Node.
opentele2-core = { path = "../../crates/opentele2-core", features = ["telethon-sqlite"] }
# `generateHeaders` and `generateFingerprint`: browserforge's header and
# fingerprint generation, run as async tasks.
opentele2-browser = { path = "../../crates/opentele2-browser", version = "2.0.0" }
# `fetchVersions`: the release feeds over blocking HTTP, run as an async task.
opentele2-versions = { path = "../../crates/opentele2-versions" }
# Already a dependency of the core, with `preserve_order`; the session JSON
# objects keep the documented key order on their way to and from JavaScript.
serde_json = "1.0.154"
# Node-API 4 is the baseline every call needs. `napi6` adds only the BigInt
# conversions of `userId`, seeds and msg ids; with `dyn-symbols` the addon
# resolves Node-API symbols at load time, so it still loads on a Node-API 4
# host. `serde-json` converts the session JSON objects.
napi = { version = "3.14.2", default-features = false, features = ["napi4", "napi6", "dyn-symbols", "serde-json"] }
napi-derive = "3.6.12"

[build-dependencies]
napi-build = "2.6.0"

# The workspace lints, except that `unsafe_code` is `deny` rather than
# `forbid`: napi-derive wraps its generated registration code in
# `#[allow(unsafe_code)]`, which `forbid` refuses (E0453). `deny` still
# rejects every hand-written `unsafe` in this crate.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

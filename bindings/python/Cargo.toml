[package]
name = "opentele2-core-python"
description = "Python bindings of opentele2-core: Telegram Desktop tdata formats and crypto for CPython 3.8+"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "opentele2_core"
crate-type = ["cdylib"]
# The module only works inside an interpreter; its behaviour is tested by
# bindings/python/tests through pytest.
test = false
doctest = false

[dependencies]
opentele2-core = { path = "../../crates/opentele2-core" }
# Already a dependency of the core; seeds the keys of `TData.new`.
getrandom = "0.4.3"
pyo3 = { version = "0.29.3", features = ["abi3-py38"] }

[lints]
workspace = true

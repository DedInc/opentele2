[package]
name = "opentele2-python"
description = "Python bindings of opentele2-core: Telegram Desktop tdata formats and crypto for CPython 3.8+"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# maturin installs the cdylib as `opentele2._native`, beside the Python
# sources of bindings/python/python/opentele2.
name = "_native"
crate-type = ["cdylib"]
# The module only works inside an interpreter; its behaviour is tested by
# bindings/python/tests through pytest.
test = false
doctest = false

[dependencies]
# `telethon-sqlite`: `write_session_file` and `read_session_file` of the
# Telethon `.session` file, with a bundled SQLite.
opentele2-core = { path = "../../crates/opentele2-core", features = ["telethon-sqlite"] }
# `fetch_versions`: the release feeds over blocking HTTP, run detached.
opentele2-versions = { path = "../../crates/opentele2-versions" }
# `generate_headers` and `generate_fingerprint`: browserforge-shaped browser
# headers and fingerprints for `opentele2.browser`.
opentele2-browser = { path = "../../crates/opentele2-browser", version = "2.0.0" }
pyo3 = { version = "0.29.3", features = ["abi3-py38"] }
# Already a dependency of the core, with `preserve_order`; the session JSON
# dicts keep 1.5.0's key order on their way to and from Python.
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[lints]
workspace = true
